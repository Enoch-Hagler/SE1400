<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BZ Tile and Renovation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <img src="logo.JPG" alt="BZ Tile and Renovation logo" class="logo">
  </header>

  <nav class="nav">
    <ul>
      <li><a href="#about">About Us</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#contact">Contact Us</a></li>
      <li><a href="#social">Social Media</a></li>
      <li><a href="#gallery">Gallery</a></li>
    </ul>
  </nav>

  <main class="page-layout">
    <div class="left-side"></div>

    <div class="center-column">
      <section class="hero" id="about">
        <div class="hero-grid">
          <div class="hero-img">
            <picture>
              <source media="(max-width: 768px)" srcset="hero.png">
              <img src="Full Black Tile.PNG" alt="Custom tiled shower">
            </picture>
          </div>

          <div class="hero-text">
            <h1>BZ Tile, We Stay BZ<br>cuz It’s EZ</h1>
            <button>Get a Free Estimate Today</button>
          </div>
        </div>
      </section>

      <section class="cards" id="products">
        <div class="card">
          <span>Floor/Wall</span>
          <picture>
            <source media="(max-width: 768px)" srcset="floor.PNG">
            <img src="floor.PNG" alt="Floor and wall tile installation">
          </picture>
        </div>

        <div class="card">
          <span>Backsplash</span>
          <picture>
            <source media="(max-width: 768px)" srcset="backsplash.png">
            <img src="backsplash.png" alt="Kitchen backsplash tile">
          </picture>
        </div>

        <div class="card">
          <span>Walk-in Showers</span>
          <picture>
            <source media="(max-width: 768px)" srcset="shower.PNG">
            <img src="shower.PNG" alt="Walk-in shower tile installation">
          </picture>
        </div>
      </section>

      <div class="gallery-btn" id="gallery">
        <button>See Full Gallery</button>
      </div>
    </div>

    <div class="right-side"></div>
  </main>

  <footer class="footer" id="contact">
    <img src="logo.JPG" alt="BZ Tile and Renovation logo">
    <div class="footer-info" id="social">
      <p>(phone #)</p>
      <p>(gmail)</p>
      <p>(social media)</p>
    </div>
  </footer>

</body>
</html>
